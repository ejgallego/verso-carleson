package_name = "CarlesonBlueprint"
blueprint_main = "BlueprintMain"
formalization_path = "Carleson"
chapter_root = "CarlesonBlueprint/Chapters"
tex_source_glob = "Carleson/blueprint/src/chapter/main.tex"

[lt]
default_chapters = [
  "CarlesonBlueprint/Chapters/Main.lean",
]

[lt.source_files]
"CarlesonBlueprint/Chapters/Main.lean" = ["Carleson/blueprint/src/chapter/main.tex"]

[lt.node_kinds]
theorem = "theorem"
definition = "definition"
lemma = "lemma_"
corollary = "corollary"
proof = "proof"
proposition = "theorem"

[harness]
native_warnings = true
strict_external_code = true
